name: Verifica produzione

# Il CI guarda il sorgente. Questo guarda il sistema acceso, che è dove si sono
# nascosti i guasti peggiori: la landing irraggiungibile perché il middleware la
# reindirizzava, il video che tornava 307 perché mp4 non era fra le estensioni
# escluse, due asset da 0 byte, un endpoint che il middleware bloccava. Nessuno
# di questi rompeva la compilazione.

on:
  # Vercel crea una deployment su GitHub a ogni push: quando passa a "success"
  # il sito è già in linea ed è il momento giusto per interrogarlo.
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: URL da verificare
        required: false
        default: https://turni-psi.vercel.app
  # I progetti Supabase del piano gratuito vanno in pausa dopo un periodo di
  # inattività, e un database in pausa spegne l'applicazione senza che nessuno
  # abbia toccato una riga di codice. Un giro al giorno se ne accorge.
  schedule:
    - cron: "0 7 * * *"

jobs:
  fumo:
    # Su deployment_status il workflow parte a ogni cambio di stato, anche
    # "pending" e "failure": senza questo filtro verificherebbe un sito che sta
    # ancora costruendo.
    if: >
      github.event_name != 'deployment_status' ||
      github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Scegli l'indirizzo
        id: indirizzo
        run: |
          url="${{ inputs.url }}"
          [ -n "$url" ] || url="https://turni-psi.vercel.app"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Verifico $url"

      - name: Smoke test
        run: ./scripts/verifica-produzione.sh "${{ steps.indirizzo.outputs.url }}"

  # Senza questo job, il job sotto gira anche quando le credenziali non
  # esistono: Playwright salta i suoi test e chiude in verde. È successo dal 3
  # al 4 agosto 2026 — «5 skipped», conclusione success, nessuna pagina
  # interrogata. Un verde che non significa niente è peggio di un rosso.
  #
  # Il contesto `secrets` non è leggibile in un `if` di job, solo dentro un
  # passo: serve quindi un job che li guardi e ne pubblichi l'esito.
  credenziali:
    if: >
      github.event_name != 'deployment_status' ||
      github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    outputs:
      presenti: ${{ steps.controllo.outputs.presenti }}
    steps:
      - id: controllo
        env:
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: |
          if [ -n "$SMOKE_EMAIL" ] && [ -n "$SMOKE_PASSWORD" ]; then
            echo "presenti=si" >> "$GITHUB_OUTPUT"
          else
            echo "presenti=no" >> "$GITHUB_OUTPUT"
            echo "::warning::SMOKE_EMAIL e SMOKE_PASSWORD non sono configurati: i test autenticati non vengono eseguiti, quindi /home, /pianificazione e /riepilogo NON sono verificate. Vedi HANDOFF.md."
          fi

  # Il primo job vede solo ciò che vede un visitatore anonimo, e per lui ogni
  # pagina protetta risponde 307 verso il login — sana o rotta che sia. I due
  # difetti del 2 agosto 2026 stavano esattamente lì dietro: /home in 500 e
  # /pianificazione in 404. Questo job entra.
  autenticato:
    needs: credenziali
    # Senza credenziali il job non parte proprio: nel riepilogo appare grigio
    # «skipped», che si distingue a colpo d'occhio da un verde.
    if: needs.credenziali.outputs.presenti == 'si'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      BASE_URL: ${{ inputs.url || 'https://turni-psi.vercel.app' }}
      # Account di sola lettura: nasce con ruolo 'lavoratore', quindi RLS gli
      # impedisce di scrivere qualunque cosa.
      SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
      SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Installa Chromium
        run: npx playwright install --with-deps chromium

      - name: Test end-to-end
        run: npm run test:e2e

      # Traccia e screenshot esistono solo quando qualcosa è fallito, ed è
      # allora che servono: un test rosso in produzione va capito subito.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
